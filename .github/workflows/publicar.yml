# Descarga las fuentes oficiales, corre los controles con datos reales y publica el sitio estático.
# Si una descarga o un control falla, no se publica: queda online la versión anterior.
name: Actualizar y publicar

on:
  schedule:
    - cron: "0 9 * * 1"   # lunes 06:00 (hora argentina)
  workflow_dispatch:       # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: pip install -r backend/requirements.txt
      - name: Descargar y cargar las fuentes oficiales
        working-directory: backend
        run: python -m observatorio.cli sync
      - name: Pruebas, incluidos los controles con datos reales
        working-directory: backend
        env:
          ODP_INTEGRATION: "1"
        run: python -m pytest -q tests
      - name: Exportar las respuestas de la API
        working-directory: backend
        run: python -m observatorio.export_static ../frontend/public/data
      - name: Construir el sitio
        working-directory: frontend
        env:
          VITE_STATIC: "1"
        run: |
          npm ci
          npx tsc -b
          npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
